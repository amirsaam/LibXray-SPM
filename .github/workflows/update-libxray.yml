name: Update engine

# Runs at midnight UTC every day. When XTLS/libXray publishes a release this
# repo has not packaged yet, the job hashes upstream's libxray-apple-cgo.zip
# asset, rewrites the url and checksum lines in Package.swift to that release,
# commits, pushes tag v<version> (26.10.29 / 26.10.30 / ...), and publishes a
# matching GitHub release. Consumers resolving the new tag make SwiftPM fetch
# the asset straight from XTLS/libXray and cache it by checksum; this repo
# stores no binaries.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corexray-engine-update
  cancel-in-progress: false

jobs:
  update:
    name: Pick up the latest XTLS/libXray release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/XTLS/libXray/releases/latest --jq .tag_name)
          version=${tag#v}
          echo "XTLS/libXray latest: $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git tag --list | grep -qx "v$version"; then
            echo "Tag v$version already exists here, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hash upstream's libxray-apple-cgo.zip
        id: asset
        if: steps.check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/XTLS/libXray/releases/download/v${VERSION}/libxray-apple-cgo.zip"
          curl -sSL --retry 3 -o /tmp/libxray-apple-cgo.zip "$url"

          # Fail loudly if the asset layout changed upstream.
          unzip -Z1 /tmp/libxray-apple-cgo.zip | grep -q "LibXray.xcframework/"

          checksum=$(sha256sum /tmp/libxray-apple-cgo.zip | cut -d" " -f1)
          echo "SHA-256: $checksum"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Point Package.swift at the new release
        if: steps.check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          CHECKSUM: ${{ steps.asset.outputs.checksum }}
        run: |
          set -euo pipefail
          python3 scripts/update_package.py --version "$VERSION" --checksum "$CHECKSUM"

      - name: Commit, tag, and publish the release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          CHECKSUM: ${{ steps.asset.outputs.checksum }}
        run: |
          set -euo pipefail
          git config user.name "corexray-updater"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- Package.swift && git diff --cached --quiet -- Package.swift; then
            # The manifest already names this release (first run, or a
            # retrigger after a partial failure). Tagging still goes ahead.
            echo "Package.swift already targets v${VERSION}; no manifest commit needed."
          else
            git add Package.swift
            git commit -m "v${VERSION}: package XTLS/libXray v${VERSION}"
            git push origin HEAD
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "CoreXray-Swift v${VERSION}" \
            --target "$(git rev-parse HEAD)" \
            --notes "Swift packaging of upstream [XTLS/libXray v${VERSION}](https://github.com/XTLS/libXray/releases/tag/v${VERSION}).

            What this is: the CoreXray Swift module over libXray's C bridge — typed sessions, configs, routing/DNS/TUN sections, geo assets, traffic, and ping — plus the LibXray.xcframework it runs against.

            How the binary gets here: \`Package.swift\` in this tag points at upstream's \`libxray-apple-cgo.zip\` (SHA-256: ${CHECKSUM}). SwiftPM downloads that asset, verifies it against the checksum, unpacks LibXray.xcframework, and caches it, so the framework itself is never stored in this repo.

            Use it with an exact pin — tags mirror upstream versions and there are no deprecation shims between them:

                .package(url: \"https://github.com/amirsaam/CoreXray-Swift.git\", .exact(\"${VERSION}\"))"

  verify:
    name: Swift build check
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.update.outputs.version }}"
      - name: Build and test the package as a consumer would
        run: swift test
